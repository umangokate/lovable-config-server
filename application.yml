spring:
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8791/eureka
      enabled: true
      register-with-eureka: true
      fetch-registery: true
    instance:
      prefer-ip-address: true
      hostname: localhost
      
